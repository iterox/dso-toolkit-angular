<form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">

  <!-- Text Input -->
  <label>
    Name:
    <input
      type="text"
      name="name"
      [(ngModel)]="formData.name"
      required
    >
  </label>

  <br><br>

  <!-- Radio Buttons -->
  <label>
    <input
      type="radio"
      name="gender"
      value="male"
      [(ngModel)]="formData.gender"
      required
    >
    Male
  </label>

  <label>
    <input
      type="radio"
      name="gender"
      value="female"
      [(ngModel)]="formData.gender"
    >
    Female
  </label>

  <br><br>

  <!-- Checkbox -->
  <label>
    <input
      type="checkbox"
      name="acceptTerms"
      [(ngModel)]="formData.acceptTerms"
    >
    Accept Terms
  </label>

  <br><br>


  <dso-selectable
    type="checkbox"
    identifier="55f9e515-41b9-4339-a22f-c5c5603a7572"
    (dsoChange)="handleChange($event)"
    [checked]="formData.acceptTerms"
    [value]="'waarde'">Label</dso-selectable>

  <button type="submit" [disabled]="myForm.invalid">
    Submit
  </button>

</form>



<ul>
  <li>Name: {{formData.name}}</li>
  <li>Gender: {{formData.gender}}</li>
  <li>Accept Terms: {{formData.acceptTerms}}</li>
</ul>
